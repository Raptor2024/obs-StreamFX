name: Build Desktop (Linux · macOS · Windows)

on:
  push:
    branches: ['claude/wordpress-desktop-app-jiEaE', 'main']
    paths: ['wordpress-client/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

env:
  QT_VERSION: '6.6.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            qt_host: linux
            qt_arch: gcc_64

          - name: macOS
            os: macos-13
            qt_host: mac
            qt_arch: clang_64

          - name: Windows
            os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2019_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          dir: ${{ runner.temp }}/Qt
          cache: false

      # ---- System dependencies ----

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nlohmann-json3-dev \
            libxkbcommon-dev libgles2-mesa-dev libegl1-mesa-dev \
            libgl1-mesa-dev libvulkan-dev \
            libpulse-dev libasound2-dev \
            fuse libfuse2 imagemagick

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json create-dmg

      # ---- Configure ----

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -S wordpress-client -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S wordpress-client -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
        shell: pwsh

      # ---- Build ----

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- Package: Linux AppImage ----

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Create a simple icon
          convert -size 256x256 xc:'#0073aa' -fill white \
            -font DejaVu-Sans-Bold -pointsize 90 \
            -gravity center -annotate 0 'WP' wp-desktop.png

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          mkdir -p AppDir/usr/{bin,share/applications,share/icons/hicolor/256x256/apps}
          cp build/wp-desktop-client AppDir/usr/bin/
          cp wp-desktop.png AppDir/usr/share/icons/hicolor/256x256/apps/wp-desktop.png

          cat > AppDir/usr/share/applications/wp-desktop.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=WordPress Desktop
          Exec=wp-desktop-client
          Icon=wp-desktop
          Type=Application
          Categories=Internet;
          DESKTOP

          QMAKE=$(which qmake6 2>/dev/null || which qmake) \
          OUTPUT=WPDesktop-Linux.AppImage \
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

          mkdir -p dist && mv WPDesktop-Linux.AppImage dist/

      # ---- Package: macOS DMG ----

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/wp-desktop-client.app
          create-dmg \
            --volname "WordPress Desktop" \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "wp-desktop-client.app" 175 180 \
            --hide-extension "wp-desktop-client.app" \
            --app-drop-link 425 180 \
            WPDesktop-macOS.dmg \
            build/wp-desktop-client.app
          mkdir -p dist && mv WPDesktop-macOS.dmg dist/

      # ---- Package: Windows ZIP ----

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build\Release\wp-desktop-client.exe"
          windeployqt --release --no-translations $exe
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\Release\* -DestinationPath dist\WPDesktop-Windows.zip

      # ---- Upload ----

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPDesktop-${{ matrix.name }}
          path: dist/
          retention-days: 30
