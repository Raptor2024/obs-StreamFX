name: Build iOS IPA

on:
  push:
    branches: ['claude/wordpress-desktop-app-jiEaE', 'main']
    paths: ['wordpress-client/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

env:
  QT_VERSION: '6.6.3'

jobs:
  build-ios:
    name: iOS arm64 (unsigned)
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      # Install Qt for the host (macOS build tools)
      - name: Install Qt — host (macOS)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          dir: ${{ runner.temp }}/Qt
          cache: true
          set-env: false

      # Install Qt for iOS
      - name: Install Qt — iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          modules: qtmultimedia
          dir: ${{ runner.temp }}/Qt
          cache: true

      - name: Configure CMake for iOS
        run: |
          QT_BASE=${{ runner.temp }}/Qt/Qt/${{ env.QT_VERSION }}
          cmake -S wordpress-client -B build \
            -DCMAKE_TOOLCHAIN_FILE="$QT_BASE/ios/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_BASE/macos" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -GXcode

      - name: Build (unsigned)
        run: |
          cmake --build build --config Release -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          # Find the built .app bundle
          APP=$(find build -name "wp-desktop-client.app" -maxdepth 6 | head -1)
          echo "Found: $APP"

          mkdir -p dist Payload
          cp -r "$APP" Payload/wp-desktop-client.app
          zip -r dist/WPDesktop-iOS-unsigned.ipa Payload/
          rm -rf Payload

          echo "IPA size: $(du -sh dist/WPDesktop-iOS-unsigned.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WPDesktop-iOS
          path: dist/WPDesktop-iOS-unsigned.ipa
          retention-days: 30
