name: Build Android APK

on:
  push:
    branches: ['claude/wordpress-desktop-app-jiEaE', 'main']
    paths: ['wordpress-client/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

env:
  QT_VERSION: '6.6.3'

jobs:
  build-android:
    name: Android arm64-v8a
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Locate pre-installed NDK
        run: |
          # GitHub ubuntu-22.04 runners ship with Android SDK + several NDK versions.
          # Pick the highest available NDK 25.x or 26.x without installing anything.
          NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_PATH" ]; then
            echo "No NDK found — installing 25.2.9519653"
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          fi
          echo "Using NDK: $NDK_PATH"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      # Step 1 — host Qt (provides moc / rcc / uic used during cross-compilation)
      - name: Install Qt — host (Linux desktop)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          dir: ${{ runner.temp }}/Qt
          cache: false   # avoid flaky cache-service failures

      - name: Save host Qt path
        run: |
          echo "QT_HOST_PATH=$QT_ROOT_DIR" >> $GITHUB_ENV
          echo "Host Qt at: $QT_ROOT_DIR"

      # Step 2 — Android target Qt (arm64-v8a libraries)
      - name: Install Qt — Android arm64-v8a
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          dir: ${{ runner.temp }}/Qt
          cache: false

      - name: Verify paths
        run: |
          echo "Qt6_DIR:        $Qt6_DIR"
          echo "QT_ROOT_DIR:    $QT_ROOT_DIR"
          echo "QT_HOST_PATH:   $QT_HOST_PATH"
          echo "ANDROID_SDK:    $ANDROID_SDK_ROOT"
          echo "ANDROID_NDK:    $ANDROID_NDK_ROOT"
          ls "$Qt6_DIR/qt.toolchain.cmake" && echo "Toolchain: OK"

      - name: Configure CMake for Android
        run: |
          cmake -S wordpress-client -B build \
            -DCMAKE_TOOLCHAIN_FILE="$Qt6_DIR/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: cmake --build build --target apk --parallel

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find build -name "*.apk" | head -1)
          echo "Found APK: $APK  ($(du -sh "$APK" | cut -f1))"
          cp "$APK" dist/WPDesktop-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WPDesktop-Android
          path: dist/WPDesktop-Android.apk
          retention-days: 30
